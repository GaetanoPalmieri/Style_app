<!doctype html>
<html lang="it" data-theme-key="style_theme" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Style Wishlist" />
  <meta name="theme-color" content="#101318" />
  <script src="suite.js?v=1.14.0"></script>
  <meta name="app-version" content="1.14.0" />
  <meta name="description" content="Wishlist personale per stagione: abbigliamento, scarpe e accessori, con budget, storico acquisti e guardaroba. Funziona offline, i dati restano sul dispositivo." />
  <link rel="manifest" href="manifest.webmanifest?v=1.14.0" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.14.0" />
  <link rel="icon" href="icon-32.png?v=1.14.0" />
  <link rel="stylesheet" href="app.css?v=1.14.0" />
  <link rel="stylesheet" href="suite.css?v=1.14.0" />
  <!-- Token grafici condivisi dalle 4 app: va caricato per ultimo. -->
  <link rel="stylesheet" href="suite-ui.css?v=1.14.0">
<link rel="stylesheet" href="suite-tokens.css?v=1.14.0" />
  <title>Style Wishlist</title>
</head>
<body>
<div id="shell">
  <div id="app">
    <header class="topbar">
      <div class="brandrow">
        <div>
          <div class="eyebrow">STYLE WISHLIST</div>
          <h1 id="screen-title">Wishlist</h1>
        </div>
        <button id="quick-add" class="iconbtn primary" aria-label="Aggiungi articolo">＋</button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav id="page-tabs" class="tabbar-bottom" aria-label="Sezioni">
      <button data-tab="wishlist" class="tab active" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Wishlist</span></button>
      <button data-tab="purchased" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 016 0v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Acquistati</span></button>
      <button data-tab="wardrobe" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 7a2 2 0 112-2M12 7v1.5L3.5 15a1.5 1.5 0 001 2.7h15a1.5 1.5 0 001-2.7L12 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Guardaroba</span></button>
      <button data-tab="more" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg><span>Altro</span></button>
    </nav>
  </div>
</div>

<dialog id="sheet"></dialog>
<input id="gallery-input" type="file" accept="image/*" multiple hidden />
<input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
<input id="backup-input" type="file" accept="application/json,.json" hidden />

<script src="app.js?v=1.14.0"></script>
</body>
</html>
