<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Style Wishlist" />
  <meta name="theme-color" content="#101318" />
  <meta name="app-version" content="1.1.0" />
  <meta name="description" content="Wishlist personale per stagione: abbigliamento, scarpe e accessori, con budget, storico acquisti e guardaroba. Funziona offline, i dati restano sul dispositivo." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-32.png" />
  <link rel="stylesheet" href="app.css" />
  <title>Style Wishlist</title>
</head>
<body>
<div id="shell">
  <nav id="sidebar" aria-label="Sezioni">
    <div class="sidebar-brand" aria-hidden="true">🧥</div>
    <div class="sidebar-nav">
      <button data-tab="wishlist" class="active"><span class="sidebar-icon" aria-hidden="true">🛍️</span><span>Wishlist</span></button>
      <button data-tab="purchased"><span class="sidebar-icon" aria-hidden="true">✓</span><span>Acquistati</span></button>
      <button data-tab="wardrobe"><span class="sidebar-icon" aria-hidden="true">👔</span><span>Guardaroba</span></button>
      <button data-tab="more"><span class="sidebar-icon" aria-hidden="true">⚙️</span><span>Altro</span></button>
    </div>
  </nav>
  <div id="app">
    <header class="topbar">
      <div class="brandrow">
        <div>
          <div class="eyebrow">STYLE WISHLIST</div>
          <h1 id="screen-title">Wishlist</h1>
        </div>
        <button id="quick-add" class="iconbtn primary" aria-label="Aggiungi articolo">＋</button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
  </div>
</div>

<dialog id="sheet"></dialog>
<input id="gallery-input" type="file" accept="image/*" multiple hidden />
<input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
<input id="backup-input" type="file" accept="application/json,.json" hidden />

<script src="app.js"></script>
</body>
</html>
